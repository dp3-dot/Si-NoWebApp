  <!-- React Script dengan JSX Babel -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

    // Safe storage wrapper to prevent SecurityError DOMException in restricted third-party sandboxed iframes
    const safeStorage = {
      getItem: (key) => {
        try {
          return window.localStorage ? window.localStorage.getItem(key) : null;
        } catch (e) {
          return null;
        }
      },
      setItem: (key, val) => {
        try {
          if (window.localStorage) window.localStorage.setItem(key, String(val));
        } catch (e) {}
      },
      removeItem: (key) => {
        try {
          if (window.localStorage) window.localStorage.removeItem(key);
        } catch (e) {}
      }
    };

    // Antrean bukti kurir lokal (IndexedDB), diproses saat koneksi pulih.
    const COURIER_QUEUE_DB = 'sinomer-courier-v2';
    const COURIER_QUEUE_STORE = 'pending-actions';
    function openCourierQueueDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('Penyimpanan offline tidak tersedia di browser ini.'));
        const req = indexedDB.open(COURIER_QUEUE_DB, 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(COURIER_QUEUE_STORE)) req.result.createObjectStore(COURIER_QUEUE_STORE, { keyPath: 'id' }); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('Gagal membuka antrean offline.'));
      });
    }
    async function putCourierQueueItem(item) {
      const db = await openCourierQueueDb();
      await new Promise((resolve, reject) => { const tx = db.transaction(COURIER_QUEUE_STORE, 'readwrite'); tx.objectStore(COURIER_QUEUE_STORE).put(item); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
      db.close();
    }
    async function getCourierQueueItems() {
      const db = await openCourierQueueDb();
      const items = await new Promise((resolve, reject) => { const req = db.transaction(COURIER_QUEUE_STORE, 'readonly').objectStore(COURIER_QUEUE_STORE).getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error); });
      db.close();
      return items.sort((a, b) => a.createdAt - b.createdAt);
    }
    async function deleteCourierQueueItem(id) {
      const db = await openCourierQueueDb();
      await new Promise((resolve, reject) => { const tx = db.transaction(COURIER_QUEUE_STORE, 'readwrite'); tx.objectStore(COURIER_QUEUE_STORE).delete(id); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
      db.close();
    }
    function isCourierNetworkFailure(err) {
      return !navigator.onLine || /tidak bisa terhubung|periksa internet|failed to fetch|networkerror/i.test(String(err && err.message || err));
    }
    function getOptionalCourierLocation(enabled) {
      if (!enabled || !navigator.geolocation) return Promise.resolve(null);
      return new Promise((resolve) => navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy || 0) }),
        () => resolve(null), { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 }
      ));
    }
    function compressCourierPhoto(file, timestampLabel, location) {
      if (!file) return Promise.resolve('');
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            let result = '';
            for (const maxSide of [1200, 960, 760, 600]) {
              const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
              canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const stamp = timestampLabel + (location ? ` • ${location.latitude.toFixed(5)}, ${location.longitude.toFixed(5)}` : ' • lokasi tidak dibagikan');
              const barH = Math.max(30, Math.round(canvas.height * 0.09));
              ctx.fillStyle = 'rgba(0,0,0,.68)'; ctx.fillRect(0, canvas.height - barH, canvas.width, barH);
              ctx.fillStyle = '#fff'; ctx.font = `${Math.max(12, Math.round(barH * 0.34))}px sans-serif`; ctx.textBaseline = 'middle';
              ctx.fillText(stamp.slice(0, 110), 10, canvas.height - barH / 2, canvas.width - 20);
              for (const quality of [0.72, 0.60, 0.50, 0.40, 0.32]) {
                result = canvas.toDataURL('image/jpeg', quality);
                if (result.length <= 47000) { URL.revokeObjectURL(url); resolve(result); return; }
              }
            }
            URL.revokeObjectURL(url);
            reject(new Error('Foto masih terlalu besar setelah dikompres. Ambil foto lebih dekat atau gunakan resolusi lebih rendah.'));
          } catch (err) { URL.revokeObjectURL(url); reject(err); }
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto tidak dapat dibaca. Coba ambil ulang sebagai JPG/JPEG.')); };
        img.src = url;
      });
    }

    // ==========================================
    // AUDIO CHIME NOTIFIKASI (Web Audio API)
    // ==========================================
    function playSound(type = 'chime') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        if (type === 'success') {
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const start = now + idx * 0.1;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.001, start);
            gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.25);
          });
        } else {
          const osc1 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.frequency.setValueAtTime(587.33, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
          osc1.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.65);
        }
      } catch (e) {}
    }

    // ==========================================
    // GOOGLE APPS SCRIPT BRIDGE (RPC CALLS)
    // ==========================================
    function callGAS(functionName, ...args) {
      // Fungsi baca boleh diulang otomatis; fungsi simpan/ubah/hapus TIDAK diulang agar tidak ganda.
      const READ = ['cariSuratUntukTelaah', 'getInitialData', 'getLiveUpdates', 'getSppdData', 'getAttachmentContent', 'getLaporanKinerja', 'loginUser'];
      const tries = READ.includes(functionName) ? 3 : 1;
      const rpcArgs = [...args];
      if (functionName !== 'loginUser' && functionName !== 'logoutUser') {
        const sessionToken = sessionStorage.getItem('sinomer_gas_token');
        if (!sessionToken) return Promise.reject(new Error('Sesi login tidak ditemukan. Silakan login kembali.'));
        rpcArgs.push(sessionToken);
      }
      if (typeof APP_URL === 'undefined' || !String(APP_URL).startsWith('http')) {
        return Promise.reject(new Error('Alamat server belum diisi di file config.js'));
      }
      return (async () => {
        for (let i = 1; ; i++) {
          try {
            const r = await fetch(APP_URL, { method: 'POST', body: JSON.stringify({ fn: functionName, args: rpcArgs }) });
            let o;
            try { o = await r.json(); } catch (pe) { throw new Error('Server mengirim jawaban yang tidak dikenal. Coba lagi sebentar lagi.'); }
            if (!o.ok) throw new Error(o.err || 'Gagal memproses data di server');
            const res = o.d;
            if (res && res.success === false) throw new Error(res.error || 'Gagal memproses data di server');
            return res;
          } catch (e) {
            const netErr = e instanceof TypeError;
            if (netErr && i < tries) { await new Promise((z) => setTimeout(z, 1500 * i)); continue; }
            throw netErr ? new Error('Tidak bisa terhubung ke server. Periksa internet Anda.') : e;
          }
        }
      })();
    }

    // ==========================================
    // DATA MASTER & KONSTANTA
    // ==========================================
    const CLASSIFICATION_CODES = [
      { code: '005', name: 'Undangan Rapat / Pertemuan', category: 'Umum', description: 'Surat undangan pertemuan dinas' },
      { code: '090', name: 'Surat Perjalanan Dinas (SPPD / SPT)', category: 'Umum', description: 'Surat tugas dinas luar kota/daerah' },
      { code: '400', name: 'Kesejahteraan Sosial & Pemberdayaan', category: 'PPPA', description: 'Urusan kesejahteraan dan anak' },
      { code: '411', name: 'Pemberdayaan Perempuan', category: 'PPPA', description: 'Pengarusutamaan gender' },
      { code: '463', name: 'Perlindungan & Hak Asasi Anak', category: 'PPPA', description: 'Kasus anak, kota layak anak' },
      { code: '476', name: 'Keluarga Berencana & Alokon', category: 'KBKS', description: 'Pelayanan KB, IUD, implan' },

    function normalizeRole(role, userObj) {
      if (!role && !userObj) return 'user';

      let r = '';
      let uname = '';
      let id = '';

      if (typeof role === 'object' && role !== null) {
        r = String(role.role || '').trim().toLowerCase();
        uname = String(role.username || '').trim().toLowerCase();
        id = String(role.id || role.userId || '').trim().toLowerCase();
      } else {
        r = String(role || '').trim().toLowerCase();
        if (userObj && typeof userObj === 'object') {
          uname = String(userObj.username || '').trim().toLowerCase();
          id = String(userObj.id || userObj.userId || '').trim().toLowerCase();
        }
      }

      // 1) Role yang tertulis di data pengguna SELALU menang.
      //    Bidang/jabatan tidak boleh menaikkan hak akses seseorang.
      if (r) {
        const rc = r.replace(/[\s_-]/g, '');
        if (rc === 'operatortu' || rc === 'stafftu') return 'operator_tu';
        if (rc === 'operatorbidang') return 'operator_bidang';
        if (r.includes('penelaah') || r.includes('telaah')) return 'penelaah_teknis';
        if (r.includes('ekspedisi') || r.includes('kurir') || r.includes('delivery')) return 'petugas_ekspedisi';
        if (r.includes('pimpin') || r.includes('kadis') || r.includes('kadin') || r.includes('kepala dinas') || r.includes('kepaladinas')) return 'pimpinan';
        if (r === 'tu' || r.indexOf('admin') === 0 || r.includes('administrator') || r.includes('admin_tu') || r.includes('admintu') || r.includes('tata usaha')) return 'admin';
        return 'user'; // 'user', 'operator', 'pengguna bidang', dan sejenisnya
      }

      // 2) Role kosong: hanya akun bawaan sistem yang dikenali.
      if (id === 'user_admin' || uname === 'admin') return 'admin';
      if (id === 'user_pimpinan' || uname === 'pimpinan') return 'pimpinan';
      if (uname.includes('ekspedisi') || id.includes('ekspedisi')) return 'petugas_ekspedisi';
      return 'user';
    }

    function normalizeDeptId(deptId, userObj) {
      let d = '';
      if (typeof deptId === 'object' && deptId !== null) {
        d = String(deptId.departmentId || deptId.id || deptId.deptId || '').trim().toLowerCase();
      } else {
        d = String(deptId || '').trim().toLowerCase();
      }

      if (!d && userObj && typeof userObj === 'object') {
        d = String(userObj.departmentId || userObj.departmentName || userObj.username || userObj.id || '').trim().toLowerCase();
      }

      // 1. UPTD PPA
      if (d.includes('uptd') || d.includes('pelaksana teknis') || d.includes('upt')) return 'uptd_ppa';

      // 2. PHPPKAPHA (Bidang Perlindungan Hak Perempuan, Perlindungan Khusus Anak, dan Pemenuhan Hak Anak)
      if (
        d.includes('phppkapha') ||
        d.includes('php') ||
        d.includes('pka') ||
        d.includes('pha') ||
        d.includes('perlindungan khusus') ||
        d.includes('pemenuhan hak') ||
        d.includes('pppa')
      ) {
        return 'phppkapha';
      }

      // 3. KHPKK (Bidang Kualitas Hidup Perempuan dan Kualitas Keluarga)
      if (d.includes('khpkk') || d.includes('khp') || d.includes('kualitas hidup') || d.includes('kualitas keluarga')) {
        return 'khpkk';
      }

      // 4. Dalduk (Bidang Pengendalian Penduduk, Data Dan Informasi)
      if (d.includes('dalduk') || d.includes('penduduk') || d.includes('informasi') || d.includes('datin') || d.includes('penyuluhan')) {
        return 'dalduk';
      }

      // 5. KBKK (Bidang Keluarga Berencana & Ketahanan Keluarga)
      if (d.includes('kbkk') || d.includes('kbks') || d.includes('keluarga berencana') || d.includes('ketahanan keluarga') || d.includes('kb')) {
        return 'kbkk';
      }

      // 6. Pimpinan & Sekretariat
      if (d.includes('pimpin') || d.includes('kadis') || d.includes('kepala dinas')) return 'pimpinan';
      if (d.includes('sekr') || d.includes('tata usaha')) return 'sekretariat';

      return d;
    }

    function formatFileSize(bytes) {

      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];

      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // ==========================================
    // STATUS LAPORAN: status internal tetap disimpan, laporan memakai istilah baku
    // ==========================================
    const reportStatusSK = (st) => {
      const v = String(st || '');
      if (v === 'dibatalkan') return 'Dibatalkan';
      if (v === 'disahkan' || v === 'arsip_final') return 'Berlaku';
      // 'draft_diunggah' (ada unggahan draf) sengaja tampil sebagai 'Tercatat': nomor sudah tercatat resmi.
      if (v === 'menunggu_telaah') return 'Menunggu Telaah';
      if (v === 'perlu_perbaikan') return 'Perlu Perbaikan';
      if (v === 'tercatat_penuh') return 'Tercatat Penuh';
      return 'Tercatat';
    };
    const reportStatusSM = (sm) => {
      const v = String((sm && sm.status) || '');
      const disp = (sm && sm.disposisiList) || [];
      if (v === 'dibatalkan') return 'Dibatalkan';
      if (v === 'selesai') return 'Selesai Ditindaklanjuti';
      if (v === 'didisposisikan' || disp.length > 0) {
        if (disp.length > 0 && disp.every((d) => d.status === 'selesai')) return 'Selesai Ditindaklanjuti';
        if (disp.some((d) => d.status === 'diproses' || d.status === 'selesai')) return 'Dalam Tindak Lanjut';
        return 'Didisposisikan';
      }
      return 'Teragenda';
    };
    const reportDisposisiTujuan = (sm) => {
      const names = [...new Set(((sm && sm.disposisiList) || []).map((d) => d.toDepartmentName).filter(Boolean))];
      return names.length ? names.join(', ') : '-';
    };
    const reportStatusClass = (label) => (
      label === 'Berlaku' || label === 'Tercatat Penuh' || label.startsWith('Selesai') ? 'bg-emerald-100 text-emerald-800'
      : label === 'Dibatalkan' || label === 'Perlu Perbaikan' ? 'bg-rose-100 text-rose-800'
      : label === 'Draft' || label === 'Teragenda' ? 'bg-amber-100 text-amber-800'
      : 'bg-sky-100 text-sky-800'
    );
    const escHtml = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const fmtTgl = (iso) => { if (!iso) return '-'; const p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : iso; };

    // ==========================================
    // KOMPONEN: LAPORAN KINERJA SAYA (BUKTI DUKUNG SKP)
    // ==========================================
    function KinerjaPanel({ currentUser, users = [], settings = {}, showToast }) {
      const role = normalizeRole(currentUser?.role, currentUser);
      const isSuper = role === 'admin' || role === 'pimpinan';
      const year = new Date().getFullYear();
      const [dari, setDari] = useState(`${year}-01-01`);
      const [sampai, setSampai] = useState(jakartaDateKey());
      const [targetUserId, setTargetUserId] = useState(currentUser?.id || '');
      const [rows, setRows] = useState(null);
      const [info, setInfo] = useState(null);
      const [loading, setLoading] = useState(false);

      const targetUser = users.find((u) => u.id === targetUserId) || currentUser || {};
      const selectable = users.filter((u) => u.isActive !== false);

      const load = () => {
        setLoading(true);
        callGAS('getLaporanKinerja', { dari, sampai, userId: isSuper ? targetUserId : undefined })
          .then((res) => { setRows(res.data.aktivitas || []); setInfo(res.data.info || {}); })
          .catch((err) => showToast('Laporan Gagal', err.message || 'Data kinerja tidak dapat dimuat.', 'alert'))
          .finally(() => setLoading(false));
      };
      useEffect(() => { load(); }, []);

    // Pratinjau PDF digambar ke canvas dengan pdf.js. Iframe/embed PDF diblokir Chrome
    // di dalam sandbox Apps Script (muncul ikon sedih) dan tidak didukung browser ponsel.
    async function preparePdfWorker(lib) {
      if (lib.__workerReady) return;
      const url = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      try {
        const res = await fetch(url);
        const text = await res.text();
        lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
      } catch (e) {
        lib.GlobalWorkerOptions.workerSrc = url;
      }
      lib.__workerReady = true;
    }

    function PdfFrame({ dataUrl, name }) {
      const hostRef = useRef(null);
      const [state, setState] = useState('loading');
      const [progress, setProgress] = useState('');
      const [fileUrl, setFileUrl] = useState('');

      useEffect(() => {
        let cancelled = false;
        let objectUrl = '';
        (async () => {
          try {
            const comma = dataUrl.indexOf(',');
            const bin = atob(dataUrl.slice(comma + 1));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            objectUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
            setFileUrl(objectUrl);
            const lib = window.pdfjsLib;
            if (!lib) throw new Error('pdf.js tidak termuat');
            await preparePdfWorker(lib);
            const pdf = await lib.getDocument({ data: bytes.slice() }).promise;
            if (cancelled) return;
            const host = hostRef.current;
            if (!host) return;
            host.innerHTML = '';
            const cssWidth = Math.max(host.clientWidth || 320, 240);
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            setState('ok');
            for (let p = 1; p <= pdf.numPages; p++) {
              if (cancelled) return;
              setProgress(`Halaman ${p} dari ${pdf.numPages}`);
              const page = await pdf.getPage(p);
              const base = page.getViewport({ scale: 1 });
              const viewport = page.getViewport({ scale: (cssWidth / base.width) * dpr });
              const canvas = document.createElement('canvas');
              canvas.width = Math.floor(viewport.width);
              canvas.height = Math.floor(viewport.height);
              canvas.style.cssText = 'width:100%;height:auto;display:block;margin:0 auto 12px;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.25)';
              host.appendChild(canvas);
              await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            }
            setProgress('');
          } catch (e) {
            console.error('Pratinjau PDF gagal:', e);
            if (!cancelled) setState('error');
          }
        })();
        return () => { cancelled = true; if (objectUrl) URL.revokeObjectURL(objectUrl); };
      }, [dataUrl]);

      return (
        <div className="w-full">
          <div className="px-3 py-1.5 text-[11px] bg-slate-100 text-slate-600 flex items-center justify-between gap-2 rounded-t-lg">
            <span className="truncate">{state === 'loading' ? 'Menyiapkan pratinjau...' : (progress || name)}</span>
            {fileUrl && <a href={fileUrl} download={name || 'lampiran.pdf'} className="font-bold text-emerald-700 underline shrink-0">Unduh PDF</a>}
          </div>
          {state === 'error' && (
            <div className="p-5 text-xs text-slate-600 text-center">Pratinjau PDF tidak dapat ditampilkan di perangkat ini. Gunakan tombol Unduh PDF di atas, atau cetak surat untuk melihat isinya.</div>
          )}
          <div ref={hostRef} className="p-2 sm:p-3" />
        </div>
      );
    }

        <div class="sign">Penelaah Teknis Kebijakan<div class="sp"></div><b><u>${esc(t.penelaahNama)}</u></b><br>${esc(pen.position || '')}<br>NIP. ${esc(pen.nip || '-')}</div>
        <script>window.onload=function(){window.print();};<\/script></body></html>`);
        w.document.close();
      };
      const done = telaahList.filter((t) => t.statusTelaah === 'Selesai').length;
      const find = (t) => (t.jenisSurat === 'Surat Masuk' ? suratMasukList : suratKeluarList).find((x) => x.id === t.suratId);

      return (
        <div className="space-y-5">
          <div>
            <h2 className="text-lg font-bold text-slate-900 dark:text-white">{isPenelaah ? 'Tugas Telaah Saya' : 'Penugasan Telaah Teknis'}</h2>
            <p className="text-xs text-slate-500">{done} selesai dari {telaahList.length} penugasan. Telaah yang selesai otomatis masuk Laporan Kinerja penelaah.</p>
          </div>

          {isSuper && (
            <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 space-y-3 text-xs">
              <h3 className="font-bold text-sm">Tugaskan Penelaah</h3>
              {penelaahUsers.length === 0 && <p className="text-amber-700 bg-amber-50 p-2 rounded-lg">Belum ada pengguna berperan Penelaah Teknis. Tambahkan di Pengaturan, Manajemen Pengguna.</p>}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                <div><label className="block font-semibold mb-1">Jenis Surat</label>
                  <select value={jenis} onChange={(e) => { setJenis(e.target.value); setSuratId(''); }} className="w-full p-2 rounded-xl border border-slate-300 dark:bg-slate-800"><option>Surat Keluar</option><option>Surat Masuk</option></select></div>
                <div className="md:col-span-2"><label className="block font-semibold mb-1">Surat <span className="font-normal text-slate-400">({options.length} belum pernah ditelaah)</span></label>
                  <select value={suratId} onChange={(e) => setSuratId(e.target.value)} className="w-full p-2 rounded-xl border border-slate-300 dark:bg-slate-800"><option value="">Pilih surat...</option>
                    {options.map((x) => <option key={x.id} value={x.id}>{(x.fullLetterNumber || x.agendaNumber) + ' - ' + (x.subject || '').slice(0, 60)}</option>)}</select></div>
                <div><label className="block font-semibold mb-1">Penelaah</label>
                  <select value={penelaahId} onChange={(e) => setPenelaahId(e.target.value)} className="w-full p-2 rounded-xl border border-slate-300 dark:bg-slate-800"><option value="">Pilih...</option>
                    {penelaahUsers.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}</select></div>
              </div>
              <div><label className="block font-semibold mb-1">Instruksi (opsional)</label>
                <input value={instruksi} onChange={(e) => setInstruksi(e.target.value)} className="w-full p-2 rounded-xl border border-slate-300 dark:bg-slate-800" placeholder="Contoh: periksa kesesuaian dasar hukum" /></div>
              <button disabled={!suratId || !penelaahId} onClick={() => { onAssign({ jenisSurat: jenis, suratId, penelaahId, instruksi }); setSuratId(''); setInstruksi(''); }}
                className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold disabled:opacity-50">Tugaskan</button>
            </div>
          )}

          {isPenelaah && (
            <div className="p-4 rounded-2xl border border-sky-200 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-900 space-y-3 text-xs">
              <div>
                <h3 className="font-bold text-sm">Telaah Mandiri</h3>
                <p className="text-slate-500">Cari surat yang belum ditelaah, lalu ambil sendiri tanpa menunggu penugasan.</p>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                <select value={jenisCari} onChange={(e) => setJenisCari(e.target.value)} className="p-2 rounded-xl border border-slate-300 dark:bg-slate-800"><option>Surat Keluar</option><option>Surat Masuk</option></select>
                <input value={qCari} onChange={(e) => setQCari(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') doCari(jenisCari, qCari); }} placeholder="Cari nomor, perihal, asal/tujuan..." className="sm:col-span-2 p-2 rounded-xl border border-slate-300 dark:bg-slate-800" />
                <button onClick={() => doCari(jenisCari, qCari)} disabled={mencari} className="px-4 py-2 rounded-xl bg-sky-600 text-white font-bold disabled:opacity-50">{mencari ? 'Mencari...' : 'Cari'}</button>
              </div>
              {hasilCari && hasilCari.length === 0 && <p className="text-slate-400 italic">Tidak ada surat yang belum ditelaah sesuai pencarian.</p>}
              <div className="space-y-2">
                {(hasilCari || []).map((x) => (
                  <div key={x.id} className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-wrap items-center justify-between gap-2">
                    <div className="min-w-0">
                      <div className="font-mono font-bold text-slate-900 dark:text-white">{x.nomor}</div>
                      <div className="text-slate-700 dark:text-slate-300">{x.perihal}</div>
                      <div className="text-slate-500">{x.pihak}{x.tanggal ? ' • ' + x.tanggal : ''}{x.bidang ? ' • ' + x.bidang : ''}</div>
                    </div>
                    <button onClick={() => { if (onSelfTake) onSelfTake(x).then((ok) => { if (ok) { setHasilCari((prev) => (prev || []).filter((y) => y.id !== x.id)); setTab('proses'); } }); }} className="px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold shrink-0">Telaah Sekarang</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="space-y-3">
            {isPenelaah && <div className="flex gap-2 text-xs font-semibold">{[['antrean', 'Belum Ditelaah'], ['proses', 'Sedang Ditelaah'], ['selesai', 'Sudah Ditelaah']].map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={`px-3 py-1.5 rounded-lg border ${tab === k ? 'bg-sky-600 text-white border-sky-600' : 'border-slate-300'}`}>{l} ({telaahList.filter((t) => tabOf(t) === k).length})</button>)}</div>}
            {shownList.length === 0 && <div className="p-6 text-center text-slate-400 italic text-xs rounded-2xl border border-dashed border-slate-300">Belum ada surat pada daftar ini.</div>}
            {shownList.map((t) => (
              <div key={t.id} className="p-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs space-y-2">
                <div className="flex flex-wrap items-start justify-between gap-2">
                  <div>
                    <div className="font-mono font-bold text-slate-900 dark:text-white">{t.nomorSurat} <span className="font-sans font-normal text-slate-500">({t.jenisSurat})</span></div>
                    <div className="text-slate-700 dark:text-slate-300">{t.perihal}</div>
                    {!isPenelaah && <div className="text-slate-500 mt-0.5">Penelaah: {t.penelaahNama}</div>}
                    {t.instruksi && <div className="text-slate-500 mt-0.5">Instruksi: {t.instruksi}</div>}
                  </div>
                  <div className="text-right space-y-1">
                    <span className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-bold ${badge(t.statusTelaah)}`}>{t.statusTelaah}</span>
                    {t.hasilTelaah && <div className="font-semibold">{t.hasilTelaah}</div>}
                  </div>
                </div>
                {(t.statusTelaah === 'Selesai' || t.statusTelaah === 'Perlu Perbaikan') && <div className="p-2 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300">Catatan: {t.catatanTelaah}{t.lampiranTelaah ? <> • <a href={t.lampiranTelaah} target="_blank" rel="noreferrer" className="text-emerald-700 underline">Lampiran</a></> : null}</div>}
                <div className="flex flex-wrap gap-2">
                  {find(t) && <button onClick={() => onOpenLetter(t.jenisSurat === 'Surat Masuk' ? 'masuk' : 'keluar', find(t))} className="px-3 py-1.5 rounded-lg border border-slate-300 font-semibold">Buka Surat</button>}
                  {isPenelaah && !t.penelaahId && <button onClick={() => onTake(t.id)} className="px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold">Ambil untuk Ditelaah</button>}
                  {t.statusTelaah === 'Selesai' && <button onClick={() => cetakLembar(t)} className="px-3 py-1.5 rounded-lg border border-slate-300 font-semibold">Cetak Lembar Telaah</button>}
                  {t.statusTelaah === 'Perlu Perbaikan' && t.pembuatId && String(t.pembuatId) === String(currentUser?.id) && (
                    <div className="w-full p-3 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 space-y-2">
                      <p className="font-semibold text-amber-900 dark:text-amber-200">Perbaiki sesuai catatan di atas, unggah draft revisi, lalu kirim ulang.</p>
                      <input type="file" multiple onChange={onPickRevision} />
                      <p className="text-slate-500">{revisionCount} berkas revisi dipilih</p>
                      <button disabled={revisionCount === 0} onClick={() => onResubmit(t.id)} className="px-3 py-1.5 rounded-lg bg-amber-600 text-white font-semibold disabled:opacity-50">Kirim Ulang Draft</button>
                    </div>
                  )}
                  {isPenelaah && t.penelaahId && t.statusTelaah === 'Belum Ditelaah' && <button onClick={() => onStart(t.id)} className="px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold">Mulai Telaah</button>}
                  {isPenelaah && t.penelaahId && (t.statusTelaah === 'Sedang Ditelaah' || t.statusTelaah === 'Belum Ditelaah') && <button onClick={() => { setOpenId(openId === t.id ? null : t.id); setCatatan(''); setLampiran(''); setHasil('Disetujui'); }} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold">Isi Hasil Telaah</button>}
                </div>
                {isPenelaah && openId === t.id && (
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 space-y-2">
                    <select value={hasil} onChange={(e) => setHasil(e.target.value)} className="w-full p-2 rounded-lg border border-slate-300 dark:bg-slate-900"><option value="Disetujui">Setujui</option><option value="Pending">Pending (perlu perbaikan)</option></select>
                    <textarea value={catatan} onChange={(e) => setCatatan(e.target.value)} rows="3" placeholder="Uraian hasil telaah (wajib)" className="w-full p-2 rounded-lg border border-slate-300 dark:bg-slate-900" />
                    <input value={lampiran} onChange={(e) => setLampiran(e.target.value)} placeholder="Link dokumen telaah (opsional)" className="w-full p-2 rounded-lg border border-slate-300 dark:bg-slate-900" />
                    <button onClick={() => { onSave({ telaahId: t.id, hasilTelaah: hasil, catatanTelaah: catatan, lampiranTelaah: lampiran }); setOpenId(null); }} className="px-4 py-2 rounded-lg bg-emerald-600 text-white font-bold">Simpan & Selesaikan</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // KOMPONEN: LAPORAN REKAPITULASI PERSURATAN MODAL
    // ==========================================
    function LaporanRekapModal({ isOpen, onClose, suratMasukList = [], suratKeluarList = [], settings = {}, departments = [] }) {
      if (!isOpen) return null;

      const MONTH_NAMES = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];

      const currentYear = new Date().getFullYear();
      const [startMonth, setStartMonth] = useState(1);
      const [startYear, setStartYear] = useState(APP_YEAR);
      const [endMonth, setEndMonth] = useState(new Date().getMonth() + 1);
      const [endYear, setEndYear] = useState(APP_YEAR);
      const [selectedDept, setSelectedDept] = useState('all');
      const [activeModalTab, setActiveModalTab] = useState('ringkasan'); // 'ringkasan' | 'surat-masuk' | 'surat-keluar' | 'pratinjau-cetak'

      const startKey = `${startYear}-${String(startMonth).padStart(2, '0')}`;
      const endKey = `${endYear}-${String(endMonth).padStart(2, '0')}`;
      const isRangeValid = startKey <= endKey;

      const applyPreset = (preset) => {
        const yr = APP_YEAR;
        if (preset === 'tahun-ini') {
          setStartMonth(1); setStartYear(yr); setEndMonth(12); setEndYear(yr);
        } else if (preset === 'q1') {
          setStartMonth(1); setStartYear(yr); setEndMonth(3); setEndYear(yr);
        } else if (preset === 'q2') {
          setStartMonth(4); setStartYear(yr); setEndMonth(6); setEndYear(yr);
        } else if (preset === 'q3') {
          setStartMonth(7); setStartYear(yr); setEndMonth(9); setEndYear(yr);
        } else if (preset === 'q4') {
          setStartMonth(10); setStartYear(yr); setEndMonth(12); setEndYear(yr);
        } else if (preset === 's1') {
          setStartMonth(1); setStartYear(yr); setEndMonth(6); setEndYear(yr);
        } else if (preset === 's2') {
          setStartMonth(7); setStartYear(yr); setEndMonth(12); setEndYear(yr);
        } else if (preset === 'bulan-ini') {
          const nowM = new Date().getMonth() + 1;
          setStartMonth(nowM); setStartYear(yr); setEndMonth(nowM); setEndYear(yr);
        }
      };

      const rangeLabel = useMemo(() => {
        const smName = MONTH_NAMES[startMonth - 1] || '';
        const emName = MONTH_NAMES[endMonth - 1] || '';
        if (startYear === endYear && startMonth === endMonth) {
          return `${smName} ${startYear}`;
        }
        if (startYear === endYear) {
          return `${smName} s/d ${emName} ${startYear}`;
        }
        return `${smName} ${startYear} s/d ${emName} ${endYear}`;
      }, [startMonth, startYear, endMonth, endYear]);

      const filteredSuratKeluar = useMemo(() => {
        if (!isRangeValid) return [];
        return (suratKeluarList || []).filter((sk) => {
          if (!sk.letterDate) return false;
          const [y, m] = sk.letterDate.split('-');
          const itemKey = `${y}-${m}`;
          const inRange = itemKey >= startKey && itemKey <= endKey;
          const matchDept = selectedDept === 'all' || sk.departmentId === selectedDept;
          return inRange && matchDept;
        });
      }, [suratKeluarList, startKey, endKey, selectedDept, isRangeValid]);

      const filteredSuratMasuk = useMemo(() => {
        if (!isRangeValid) return [];
        return (suratMasukList || []).filter((sm) => {
          const dateToCheck = sm.receivedDate || sm.letterDate || '';
          if (!dateToCheck) return false;
          const [y, m] = dateToCheck.split('-');
          const itemKey = `${y}-${m}`;
          const inRange = itemKey >= startKey && itemKey <= endKey;
          return inRange;
        });
      }, [suratMasukList, startKey, endKey, isRangeValid]);

      const monthlySummary = useMemo(() => {
        if (!isRangeValid) return [];
        const months = [];
        let curYear = startYear;
        let curMonth = startMonth;

        while (curYear < endYear || (curYear === endYear && curMonth <= endMonth)) {
          const k = `${curYear}-${String(curMonth).padStart(2, '0')}`;
          const label = `${MONTH_NAMES[curMonth - 1]} ${curYear}`;

          const masukInMonth = filteredSuratMasuk.filter((sm) => {
            const d = sm.receivedDate || sm.letterDate || '';
            return d.startsWith(k);
          });

          const keluarInMonth = filteredSuratKeluar.filter((sk) => {
            const d = sk.letterDate || '';
            return d.startsWith(k);
          });

          const disposisiCount = masukInMonth.reduce(
            (acc, curr) => acc + (curr.disposisiList ? curr.disposisiList.length : 0),
            0
          );

          months.push({
            key: k,
            label,
            year: curYear,
            month: curMonth,
            suratMasukCount: masukInMonth.length,
            suratKeluarCount: keluarInMonth.length,
            disposisiCount,
            totalCount: masukInMonth.length + keluarInMonth.length,
          });

          curMonth++;
          if (curMonth > 12) {
            curMonth = 1;
            curYear++;
          }
        }
        return months;
      }, [startYear, startMonth, endYear, endMonth, filteredSuratMasuk, filteredSuratKeluar, isRangeValid]);

      const grandTotals = useMemo(() => {
        const totalMasuk = filteredSuratMasuk.length;
        const totalKeluar = filteredSuratKeluar.length;
        const totalSemua = totalMasuk + totalKeluar;
        const totalDisposisi = filteredSuratMasuk.reduce(
          (acc, curr) => acc + (curr.disposisiList ? curr.disposisiList.length : 0),
          0
        );
        return { totalMasuk, totalKeluar, totalSemua, totalDisposisi };
      }, [filteredSuratMasuk, filteredSuratKeluar]);

      const departmentSummary = useMemo(() => {
        return (departments || [])
          .filter((d) => d.id !== 'pimpinan')
          .map((dept) => {
            const keluarCount = filteredSuratKeluar.filter((sk) => sk.departmentId === dept.id).length;
            let disposisiMasukCount = 0;
            filteredSuratMasuk.forEach((sm) => {
              (sm.disposisiList || []).forEach((disp) => {
                if (disp.toDepartmentId === dept.id) {
                  disposisiMasukCount++;
                }
              });
            });
            return {
              id: dept.id,
              name: dept.name,
              shortName: dept.shortName,
              code: dept.code,
              keluarCount,
              disposisiMasukCount,
              totalActivity: keluarCount + disposisiMasukCount,
            };
          });
      }, [departments, filteredSuratKeluar, filteredSuratMasuk]);

      const handleExportCsv = (type) => {
        let csvContent = '\uFEFF';
        let filename = '';

        if (type === 'ringkasan' || type === 'semua') {
          csvContent += `"LAPORAN REKAPITULASI PERSURATAN DINAS"\n`;
          csvContent += `"Instansi:","${settings.agencyName || 'DP3APPKB Rejang Lebong'}"\n`;
          csvContent += `"Periode:","${rangeLabel}"\n\n`;

          csvContent += `"RINGKASAN PER BULAN"\n`;
          csvContent += `"No.","Periode Bulan","Surat Masuk","Surat Keluar","Total Naskah","Disposisi Diteruskan"\n`;
          monthlySummary.forEach((m, idx) => {
            csvContent += `"${idx + 1}","${m.label}","${m.suratMasukCount}","${m.suratKeluarCount}","${m.totalCount}","${m.disposisiCount}"\n`;
          });
          csvContent += `"TOTAL","KESELURUHAN","${grandTotals.totalMasuk}","${grandTotals.totalKeluar}","${grandTotals.totalSemua}","${grandTotals.totalDisposisi}"\n\n`;

          csvContent += `"DISTRIBUSI PER BIDANG UNIT KERJA"\n`;
          csvContent += `"No.","Nama Bidang","Kode","Surat Keluar Dibuat","Disposisi Diterima","Total Aktivitas"\n`;
          departmentSummary.forEach((d, idx) => {
            csvContent += `"${idx + 1}","${d.name}","${d.code}","${d.keluarCount}","${d.disposisiMasukCount}","${d.totalActivity}"\n`;
          });
          csvContent += `\n`;
          filename = `Rekap_Surat_${rangeLabel.replace(/[\s/]/g, '_')}.csv`;
        }

        if (type === 'surat-masuk' || type === 'semua') {
          if (type === 'semua') csvContent += `\n"RINCIAN SURAT MASUK (${filteredSuratMasuk.length} Surat)"\n`;
          const smHeaders = ['No.', 'No. Agenda', 'Tgl Terima', 'Nomor Surat', 'Tgl Surat', 'Asal Pengirim', 'Perihal', 'Sifat', 'Status Surat', 'Tujuan Disposisi'];
          csvContent += smHeaders.map((h) => `"${h}"`).join(',') + '\n';
          filteredSuratMasuk.forEach((sm, idx) => {
            const dispTujuan = sm.disposisiList && sm.disposisiList[0] ? sm.disposisiList[0].toDepartmentName : 'Belum Disposisi';
            csvContent += [
              `"${idx + 1}"`,
              `"${sm.agendaNumber}"`,
              `"${sm.receivedDate}"`,
              `"${sm.letterNumber}"`,
              `"${sm.letterDate}"`,
              `"${(sm.sender || '').replace(/"/g, '""')}"`,
              `"${(sm.subject || '').replace(/"/g, '""')}"`,
              `"${sm.confidentiality}"`,
              `"${reportStatusSM(sm)}"`,
              `"${dispTujuan.replace(/"/g, '""')}"`,
            ].join(',') + '\n';
          });
          if (type === 'surat-masuk') {
            filename = `Detail_Surat_Masuk_${rangeLabel.replace(/[\s/]/g, '_')}.csv`;
          }
        }

        if (type === 'surat-keluar' || type === 'semua') {
          if (type === 'semua') csvContent += `\n"RINCIAN SURAT KELUAR (${filteredSuratKeluar.length} Surat)"\n`;
          const skHeaders = ['No. Urut', 'Nomor Resmi Surat Keluar', 'Tgl Surat', 'Bidang Pemohon', 'Nama Pengambil', 'Tujuan / Kepada Yth.', 'Perihal', 'Status'];
          csvContent += skHeaders.map((h) => `"${h}"`).join(',') + '\n';
          filteredSuratKeluar.forEach((sk) => {
            csvContent += [
              `"#${padNumber(sk.queueNumber, 3)}"`,
              `"${sk.fullLetterNumber}"`,
              `"${sk.letterDate}"`,
              `"${sk.departmentName}"`,
              `"${sk.requestedByUserName}"`,
              `"${(sk.destination || '').replace(/"/g, '""')}"`,
              `"${(sk.subject || '').replace(/"/g, '""')}"`,
              `"${reportStatusSK(sk.status)}"`,
            ].join(',') + '\n';
          });
          if (type === 'surat-keluar') {
            filename = `Detail_Surat_Keluar_${rangeLabel.replace(/[\s/]/g, '_')}.csv`;
          }
        }

        const encodedUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };


      const handlePrintReport = () => {
        const source = document.querySelector('.report-printable');
        if (!source) return;
        const printWindow = window.open('', '_blank');
        if (!printWindow) return;
        const content = source.innerHTML;
        printWindow.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Laporan Rekapitulasi Persuratan</title><style>

      const levelOptions=['Tingkat A','Tingkat B','Tingkat C','Tingkat D']; const transportOptions=['Kendaraan Dinas','Kendaraan Umum/Bus','Kereta Api','Pesawat Udara','Kapal Laut','Kendaraan Sewa','Lainnya'];

iv></form>;
      const listView = <div className="space-y-4"><div className="flex items-center justify-between"><div><h2 className="text-xl font-black">Daftar SPPD</h2><p className="text-xs text-slate-500">Data diperbarui otomatis setiap 15 detik.</p></div><button onClick={()=>{setForm(makeBlank());setEditingId(null);setMsg('');setView('form')}} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">+ Buat SPPD</button></div>{msg&&<div className="text-xs text-rose-700">{msg}</div>}<div className="bg-white dark:bg-slate-900 rounded-2xl border overflow-x-auto"><table className="w-full text-xs"><thead><tr className="bg-slate-100 dark:bg-slate-800"><th className="p-3 text-left">Nomor</th><th className="p-3 text-left">Pegawai</th><th className="p-3 text-left">Tujuan</th><th className="p-3 text-left">Tanggal</th><th className="p-3 text-left">Aksi</th></tr></thead><tbody>{rows.length===0?<tr><td colSpan="5" className="p-8 text-center text-slate-500">Belum ada SPPD.</td></tr>:rows.map(x=><tr key={x.id} className="border-t"><td className="p-3 font-bold">{x.nomorSppd}</td><td className="p-3">{x.pegawaiPelaksana}<br/><span className="text-slate-500">{x.nipPelaksana}</span></td><td className="p-3">{x.tempatTujuan}</td><td className="p-3">{toDisplay(x.tanggalBerangkat)} s.d. {toDisplay(x.tanggalKembali)}</td><td className="p-3 flex gap-1"><button onClick={()=>{setSelected(x);print(x)}} className="px-2 py-1 rounded bg-blue-600 text-white">Cetak</button><button onClick={()=>beginEdit(x)} className="px-2 py-1 rounded bg-amber-500 text-white">Edit</button>{role==='admin'&&<button onClick={()=>remove(x)} className="px-2 py-1 rounded bg-rose-600 text-white">Hapus</button>}</td></tr>)}</tbody></table></div></div>;

    function EkspedisiRecipientEditor({ initialRecipients = [] }) {
      const blankRecipient = () => ({ namaInstansi: '', alamat: '', nomorTelepon: '' });
      const [rows, setRows] = useState(() => {
        const existing = (initialRecipients || []).map((r) => ({ namaInstansi: r.namaInstansi || '', alamat: r.alamat || '', nomorTelepon: r.nomorTelepon || '' }));
        return existing.length ? existing : Array.from({ length: 5 }, blankRecipient);
      });
      const [pasteOpen, setPasteOpen] = useState(false);
      const [pasteText, setPasteText] = useState('');
      const [preview, setPreview] = useState(null);
      const [pasteError, setPasteError] = useState('');
      const updateRow = (index, key, value) => setRows((prev) => prev.map((row, i) => i === index ? { ...row, [key]: value } : row));
      const removeRow = (index) => setRows((prev) => prev.length <= 1 ? [blankRecipient()] : prev.filter((_, i) => i !== index));
      const filledCount = rows.filter((r) => r.namaInstansi.trim() || r.alamat.trim() || r.nomorTelepon.trim()).length;
      const duplicateIndexes = new Set();
      const seenRecipients = new Map();
      rows.forEach((r, i) => {
        const key = `${r.namaInstansi.trim().toLocaleLowerCase()}|${r.alamat.trim().toLocaleLowerCase()}`;
        if (!r.namaInstansi.trim() && !r.alamat.trim()) return;
        if (seenRecipients.has(key)) { duplicateIndexes.add(i); duplicateIndexes.add(seenRecipients.get(key)); }
        else seenRecipients.set(key, i);

      const previewPaste = () => {
        setPasteError('');
        const rawLines = pasteText.split(/\r?\n/).map((line, index) => ({ line: line.trim(), lineNo: index + 1 })).filter((x) => x.line);
        if (!rawLines.length) { setPreview(null); setPasteError('Tempel dulu daftar penerima dari Excel atau Google Sheets.'); return; }
        const firstCells = rawLines[0].line.split(rawLines[0].line.includes('\t') ? '\t' : '|').map((x) => x.trim().toLocaleLowerCase());
        const hasHeader = firstCells.length > 1 && /nama|opd|penerima/.test(firstCells[0]) && /alamat/.test(firstCells[1]);
        const dataLines = hasHeader ? rawLines.slice(1) : rawLines;
        const parsed = dataLines.map((item) => {
          const delimiter = item.line.includes('\t') ? '\t' : '|';
          const cells = item.line.split(delimiter).map((x) => x.trim());
          return { lineNo: item.lineNo, namaInstansi: cells[0] || '', alamat: cells[1] || '', nomorTelepon: cells[2] || '', extraColumns: Math.max(0, cells.length - 3) };
        });
        const seen = new Set();
        const rowsWithWarnings = parsed.map((r) => {
          const warnings = [];
          if (!r.namaInstansi) warnings.push('nama belum diisi');
          if (!r.alamat) warnings.push('alamat kosong');
          if (r.extraColumns) warnings.push('ada kolom tambahan yang tidak dipakai');
          const key = `${r.namaInstansi.toLocaleLowerCase()}|${r.alamat.toLocaleLowerCase()}`;
          if (r.namaInstansi && r.alamat && seen.has(key)) warnings.push('kemungkinan duplikat');
          if (r.namaInstansi && r.alamat) seen.add(key);
          return { ...r, warnings };
        });
        if (!rowsWithWarnings.length) { setPreview(null); setPasteError('Tidak ditemukan baris penerima.'); return; }
        setPreview(rowsWithWarnings);
      };
      const usePreview = () => {
        if (!preview?.length) return;
        const imported = preview.map(({ namaInstansi, alamat, nomorTelepon }) => ({ namaInstansi, alamat, nomorTelepon }));
        while (imported.length < 5) imported.push(blankRecipient());
        setRows(imported);
        setPasteOpen(false);
        setPreview(null);
        setPasteText('');
        setPasteError('');
      };
      return <div className="space-y-3">
        <div className="flex flex-wrap items-center justify-between gap-2"><p className="text-[11px] text-slate-500">Isi langsung di bawah atau tempel daftar dari Excel/Google Sheets. Nomor telepon opsional.</p><span className="rounded-full bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 px-2.5 py-1 text-[11px] font-bold">{filledCount} tujuan</span></div>
        <div className="flex flex-wrap gap-2"><button type="button" onClick={() => { setPasteOpen((v) => !v); setPasteError(''); }} className="min-h-10 px-3 py-2 rounded-xl border border-blue-300 text-blue-700 dark:text-blue-300 dark:border-blue-800 font-bold text-xs">{pasteOpen ? 'Tutup tempel daftar' : 'Tempel daftar dari Excel/Google Sheets'}</button><button type="button" onClick={() => setRows((prev) => [...prev, blankRecipient()])} className="min-h-10 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs">+ Tambah tujuan</button></div>

        const curDeptId = normalizeDeptId(currentUser.departmentId, currentUser);

        return suratMasukList.filter((sm) => {
          // Aturan Role: User bidang HANYA melihat surat masuk yang SUDAH DIDISPOSISIKAN ke bidangnya
          if ((curRole === 'user' || curRole === 'operator_bidang')) {
            const hasDisposisiToMyDept = sm.disposisiList && sm.disposisiList.some(
              (d) => normalizeDeptId(d.toDepartmentId) === curDeptId
            );
            if (!hasDisposisiToMyDept) return false;
          }

          // Filter status surat masuk
          if (statusFilterSuratMasuk !== 'all') {
            const curStatus = sm.status || 'belum_disposisi';
            if (curStatus !== statusFilterSuratMasuk) return false;
          }

          // Filter urgensi surat masuk
          if (urgencyFilterSuratMasuk !== 'all') {
            const curUrg = sm.urgency || 'biasa';
            if (curUrg !== urgencyFilterSuratMasuk) return false;
          }

          // Pencarian teks
          if (searchSuratMasuk.trim()) {
            const q = searchSuratMasuk.toLowerCase();
            const matchAgenda = (sm.agendaNumber || '').toLowerCase().includes(q);
            const matchNum = (sm.letterNumber || '').toLowerCase().includes(q);
            const matchSender = (sm.sender || '').toLowerCase().includes(q);
            const matchSubj = (sm.subject || '').toLowerCase().includes(q);
            if (!matchAgenda && !matchNum && !matchSender && !matchSubj) return false;
          }

          return true;
        });
      }, [suratMasukList, currentUser, searchSuratMasuk, statusFilterSuratMasuk, urgencyFilterSuratMasuk]);

      // 3. Filter Ketat Pusat Disposisi
      const displayDisposisiList = useMemo(() => {
        if (!currentUser) return [];
        const curRole = normalizeRole(currentUser.role, currentUser);
        const curDeptId = normalizeDeptId(currentUser.departmentId, currentUser);

        const allDisposisi = suratMasukList.flatMap((s) =>
          (s.disposisiList || []).map((d) => ({ surat: s, disposisi: d }))
        );

        if ((curRole === 'user' || curRole === 'operator_bidang')) {
          // HANYA menampilkan disposisi yang ditujukan ke bidang user
          return allDisposisi.filter(({ disposisi }) => normalizeDeptId(disposisi.toDepartmentId) === curDeptId);
        }

        // Admin & Pimpinan melihat seluruh disposisi semua bidang
        return allDisposisi;
      }, [suratMasukList, currentUser]);

      const visibleEkspedisiList = useMemo(() => {
        const q = String(ekspedisiSearch || '').trim().toLowerCase();
        return (ekspedisiList || []).filter((eksp) => {
          const recipients = eksp.recipients || [];
          const isDone = recipients.length > 0 && recipients.every((r) => r.status === 'diterima');
          const hasDelayed = recipients.some((r) => r.status === 'dijadwalkan_ulang');
          const hasCancelled = recipients.some((r) => r.status === 'ditolak' || r.status === 'tidak_ditemui');
          const deliveryDate = String(eksp.tanggalPengiriman || '').slice(0, 10);
          if (ekspedisiStatusFilter === 'aktif' && (isDone || hasCancelled || hasDelayed)) return false;
          if (ekspedisiStatusFilter === 'selesai' && !isDone) return false;
          if (ekspedisiStatusFilter === 'tertunda' && !hasDelayed) return false;
          if (ekspedisiStatusFilter === 'dibatalkan' && !hasCancelled) return false;
          if (ekspedisiPeriodFilter === 'today' && deliveryDate !== jakartaDateKey()) return false;
          if (ekspedisiPeriodFilter === 'date' && deliveryDate !== ekspedisiDateFilter) return false;
          if (ekspedisiPeriodFilter === 'month' && !deliveryDate.startsWith(ekspedisiMonthFilter)) return false;
          if (ekspedisiPeriodFilter === 'year' && !deliveryDate.startsWith(ekspedisiYearFilter)) return false;
          if (!q) return true;
          return [eksp.nomorSurat, eksp.perihal, eksp.petugasNama, ...recipients.flatMap((r) => [r.namaInstansi, r.namaPenerima, r.status])].some((v) => String(v || '').toLowerCase().includes(q));

        if (role === 'admin' || role === 'user' || role === 'operator_tu' || role === 'operator_bidang') {

        return items;

      const MONTHS_OPTIONS = [

      const agendaMonthLabel = useMemo(() => {
        if (agendaMonth === 'all') return 'Semua Bulan';

      const filteredAgendaKeluar = useMemo(() => {
        return suratKeluarList.filter((s) => {

      const handleExportAgendaCsv = () => {
        let headers = [];
        let rows = [];
        let filename = '';

        if (agendaSubTab === 'masuk') {
          headers = ['No.', 'No. Agenda', 'Tgl Terima', 'Nomor Surat', 'Tgl Surat', 'Asal Pengirim', 'Perihal', 'Sifat', 'Status Surat', 'Tujuan Disposisi'];

            `"${s.agendaNumber}"`,
            `"${s.receivedDate}"`,
            `"${s.letterNumber}"`,
            `"${s.letterDate}"`,
            `"${s.sender}"`,
            `"${(s.subject || '').replace(/"/g, '""')}"`,
            `"${s.confidentiality}"`,
            `"${reportStatusSM(s)}"`,
            `"${s.disposisiList && s.disposisiList[0] ? s.disposisiList[0].toDepartmentName : '-'}"`,

          headers = ['No. Urut', 'Nomor Resmi Surat Keluar', 'Tgl Surat', 'Bidang Pemohon', 'Nama Pengambil', 'Tujuan / Kepada Yth.', 'Perihal', 'Status'];
          rows = filteredAgendaKeluar.map((s) => [
            `"#${padNumber(s.queueNumber, 3)}"`,
            `"${s.fullLetterNumber}"`,
            `"${s.letterDate}"`,
            `"${s.departmentName}"`,
            `"${s.requestedByUserName}"`,
            `"${(s.destination || '').replace(/"/g, '""')}"`,
            `"${(s.subject || '').replace(/"/g, '""')}"`,
            `"${reportStatusSK(s.status)}"`,
          ]);
          filename = `Rekap_Surat_Keluar_${agendaMonthLabel.replace(/\\s+/g, '_')}_${agendaYear}.csv`;
        }

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

                              <input

                                onChange={(e) => {
                                  const file = e.target.files && e.target.files[0];
                                  if (file) {
                                    if (file.size > 5 * 1024 * 1024) {
                                      alert('Ukuran file logo terlalu besar. Maksimal ukuran 5MB.');

                                    }
                                    showToast('Memproses Logo', 'Sedang memuat & mengoptimasi berkas logo kop surat...', 'info');
                                    const reader = new FileReader();

                                      const rawData = ev.target && ev.target.result;

                                        setCustomLogoUrl(rawData);

                                        try {
                                          const maxDim = 100;
                                          let w = img.width;

                                              w = maxDim;

                                          canvas.height = h;

                <form key={ekspEditing?.id || 'baru'} onSubmit={(e) => { e.preventDefault(); const f=e.target; const sk=displaySuratKeluar.find(x => x.id === f.suratKeluarId.value); const inputRows=Array.from(f.querySelectorAll('[data-recipient-row]')).map((row,index)=>({rowNo:index+1,recipient:{namaInstansi:row.querySelector('[data-recipient-field=namaInstansi]').value.trim(),alamat:row.querySelector('[data-recipient-field=alamat]').value.trim(),nomorTelepon:row.querySelector('[data-recipient-field=nomorTelepon]').value.trim()}})).filter(x=>x.recipient.namaInstansi||x.recipient.alamat||x.recipient.nomorTelepon); if(!inputRows.length){showToast('Daftar tujuan kosong','Isi setidaknya satu tujuan.','alert');return;} const incomplete=inputRows.find(x=>!x.recipient.namaInstansi||!x.recipient.alamat); if(incomplete){showToast('Periksa daftar tujuan',`Baris ${incomplete.rowNo}: nama dan alamat wajib diisi. Nomor telepon opsional.`,'alert');return;} const recipients=inputRows.map(x=>x.recipient); const pet=users.find(u=>u.id===f.petugasId.value); if (ekspEditing) { handleEditEkspedisi({id:ekspEditing.id, petugasId:f.petugasId.value, petugasNama:pet?.name||'', tanggalPengiriman:f.tanggalPengiriman.value, catatan:f.catatan.value, recipients}); return; } handleCreateEkspedisi({suratKeluarId:f.suratKeluarId.value, nomorSurat:sk?.fullLetterNumber||'', perihal:sk?.subject||'', petugasId:f.petugasId.value, petugasNama:pet?.name||'', tanggalPengiriman:f.tanggalPengiriman.value, catatan:f.catatan.value, recipients}); }} className="p-6 space-y-4 max-h-[78vh] overflow-y-auto text-xs">

                <form onSubmit={async (e)=>{e.preventDefault(); const f=e.currentTarget; const status=f.status.value; const failed=status!=='diterima'; if(status==='diterima'&&!f.namaPenerima.value.trim()){showToast('Nama penerima wajib','Isi nama penerima untuk serah-terima berhasil.','alert');return;} if(failed&&!f.failureReason.value){showToast('Pilih alasan','Pilih alasan kegagalan terlebih dahulu.','alert');return;} if(f.failureReason.value==='Lainnya'&&!f.catatan.value.trim()){showToast('Catatan wajib','Jelaskan alasan Lainnya pada catatan.','alert');return;} const loc=await getOptionalCourierLocation(f.shareLocation.checked); const stamp=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}); try { const photo=await compressCourierPhoto(f.photo.files[0],stamp,loc); const canvas=signatureCanvasRef.current; handleUpdateEkspedisiRecipient({recipientId:activeEkspedisiRecipient.id,namaPenerima:f.namaPenerima.value,jabatanPenerima:f.jabatanPenerima.value,status,catatan:f.catatan.value,failureReason:failed?f.failureReason.value:'',signatureData:canvas&&!canvas.dataset.empty?canvas.toDataURL('image/png'):'',photoData:photo,location:loc}); } catch(err) { showToast('Bukti belum dapat diproses',err.message||'Gagal memproses foto.','alert'); } }} className="p-5 sm:p-6 space-y-4 text-sm max-h-[85vh] overflow-y-auto"><div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800"><p className="font-bold">{activeEkspedisiRecipient.namaInstansi}</p><p className="text-slate-500">{activeEkspedisiRecipient.alamat||'Alamat belum diisi'}</p></div><div className="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label className="block font-semibold mb-1">Nama Penerima</label><input name="namaPenerima" required={deliveryFormStatus==='diterima'} className="w-full min-h-12 p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-base" /></div><div><label className="block font-semibold mb-1">Jabatan</label><input name="jabatanPenerima" className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800" /></div></div><div><label className="block font-semibold mb-1">Status</label><select name="status" value={deliveryFormStatus} onChange={(e)=>setDeliveryFormStatus(e.target.value)} className="w-full min-h-12 p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-base"><option value="diterima">Berhasil diterima</option><option value="tidak_ditemui">Tidak ditemui</option><option value="ditolak">Ditolak</option><option value="dijadwalkan_ulang">Jadwalkan ulang</option></select></div>{deliveryFormStatus!=='diterima' && <div><label className="block font-semibold mb-1">Alasan gagal</label><select name="failureReason" defaultValue="" className="w-full min-h-12 p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-base"><option value="">Pilih alasan</option><option>Penerima tidak ditemui</option><option>Penerima menolak</option><option>Alamat tidak ditemukan</option><option>Lokasi tutup</option><option>Diminta jadwalkan ulang</option><option>Lainnya</option></select></div>}<div><label className="block font-semibold mb-1">Tanda Tangan Penerima</label><canvas ref={signatureCanvasRef} width="520" height="150" data-empty="true" className="w-full h-32 border border-slate-300 dark:border-slate-600 rounded-xl bg-white touch-none" onPointerDown={(e)=>{const c=signatureCanvasRef.current; const ctx=c.getContext('2d'); const r=c.getBoundingClientRect(); const x=(e.clientX-r.left)*c.width/r.width; const y=(e.clientY-r.top)*c.height/r.height; ctx.beginPath(); ctx.moveTo(x,y); c.dataset.empty='false'; c.setPointerCapture(e.pointerId);}} onPointerMove={(e)=>{if(e.currentTarget.hasPointerCapture(e.pointerId)){const c=signatureCanvasRef.current; const ctx=c.getContext('2d'); const r=c.getBoundingClientRect(); const x=(e.clientX-r.left)*c.width/r.width; const y=(e.clientY-r.top)*c.height/r.height; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111827'; ctx.lineTo(x,y); ctx.stroke();}}} /><button type="button" onClick={()=>{const c=signatureCanvasRef.current;c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.empty='true';}} className="mt-2 px-4 py-2 rounded-lg border font-bold">Hapus tanda tangan</button></div><div><label className="block font-semibold mb-1">Foto bukti (opsional, otomatis dikompres)</label><input type="file" name="photo" accept="image/*" capture="environment" className="w-full min-h-12 p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800" /><p className="text-xs text-slate-500 mt-1">Foto diberi cap waktu. Ukuran dibatasi agar dapat disimpan di spreadsheet.</p></div><label className="flex items-start gap-3 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30"><input type="checkbox" name="shareLocation" className="mt-1 w-5 h-5" /><span><strong>Sertakan lokasi saat ini (opsional)</strong><span className="block text-xs text-slate-600 dark:text-slate-300 mt-1">Browser akan meminta izin lokasi. Jika ditolak/tidak tersedia, bukti tetap dapat disimpan tanpa lokasi.</span></span></label><div><label className="block font-semibold mb-1">Catatan</label><textarea name="catatan" rows="2" className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800"></textarea></div><div className="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-700"><button type="button" onClick={()=>setActiveEkspedisiRecipient(null)} className="px-4 py-2 rounded-xl">Batal</button><button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold">Simpan Bukti</button></div></form></div>

                  if (res && res.success && res.dataUrl) setViewingDocument((prev) => prev && prev.viewerId === viewerId ? { ...prev, attachment: { ...prev.attachment, dataUrl: res.dataUrl, name: res.name || prev.attachment.name, type: res.type || prev.attachment.type, size: res.size || prev.attachment.size }, loading: false } : prev);

              } else {
                setViewingDocument({ attachment, title, subtitle });

                      type="submit"
                      disabled={isLoading}
                      className="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs transition-colors"
                    >
                      <Icon name="save" className="w-4 h-4" />
                      <span>{editingDept ? 'Simpan Perubahan Unit' : 'Simpan ke Spreadsheet'}</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 10: KONFIRMASI HAPUS PENGGUNA */}
          {userToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in p-6 space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto">
                  <Icon name="trash" className="w-6 h-6" />
                </div>
                <div className="text-center space-y-1">
                  <h3 className="font-bold text-base text-slate-900">Hapus Akun Pengguna?</h3>
                  <p className="text-xs text-slate-500">
                    Akun <strong className="text-slate-900">{userToDelete.name}</strong> (@{userToDelete.username}) akan dihapus secara permanen dari basis data.
                  </p>
                </div>
                <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-[11px]">
                  💡 <strong>Saran:</strong> Jika pegawai masih aktif tetapi ingin dibatasi aksesnya sementara, gunakan fitur <em>Nonaktifkan Akun</em> alih-alih menghapus.
                </div>
                <div className="flex items-center gap-2 pt-2">
                  <button
                    onClick={() => setUserToDelete(null)}
                    className="flex-1 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50"
                  >
                    Batal
                  </button>
                  <button
                    onClick={() => handleDeleteUser(userToDelete.id)}
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold hover:bg-rose-700 shadow-xs"
                  >
                    Ya, Hapus Akun
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 11: LAPORAN TINDAK LANJUT & PENYELESAIAN DISPOSISI BIDANG */}
          {feedbackModalDisp && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in">
                <div className="px-6 py-4 bg-gradient-to-r from-emerald-600 to-teal-600 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="check" className="w-5 h-5" />
                    <div>
                      <h3 className="font-bold text-sm">Laporan Hasil Tindak Lanjut Disposisi</h3>
                      <p className="text-[11px] text-emerald-100">Bidang: {feedbackModalDisp.toDepartmentName}</p>
                    </div>
                  </div>
                  <button onClick={() => setFeedbackModalDisp(null)} className="text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    handleUpdateStatusDisposisi(feedbackModalDisp.id, 'selesai', feedbackText);
                  }}
                  className="p-6 space-y-4 text-xs"
                >
                  <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1">
                    <p className="font-bold text-slate-800">Instruksi Pimpinan:</p>
                    <p className="text-slate-600">
                      {Array.isArray(feedbackModalDisp.instructions) ? feedbackModalDisp.instructions.join(', ') : feedbackModalDisp.instructions}
                    </p>
                    {feedbackModalDisp.customNotes && (
                      <p className="italic text-slate-500 text-[11px]">"{feedbackModalDisp.customNotes}"</p>
                    )}
                  </div>

                  <div>
                    <label className="block font-bold text-slate-800 mb-1">
                      Catatan / Laporan Umpan Balik Penyelesaian <span className="text-rose-500">*</span>
                    </label>
                    <textarea
                      rows="4"
                      value={feedbackText}
                      onChange={(e) => setFeedbackText(e.target.value)}
                      placeholder="Jelaskan tindakan yang telah diambil oleh bidang (contoh: Dokumen telah ditelaah, surat balasan telah diterbitkan dengan No. 000.1.2/12/DP3APPKB/2025, dsb)..."
                      className="w-full p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none"
                      required
                    ></textarea>
                    <p className="text-[10px] text-slate-400 mt-1">
                      Laporan ini akan tercatat di lembar disposisi dan dapat ditinjau oleh Pimpinan Kadis & Admin TU.
                    </p>
                  </div>

                  <div className="pt-3 border-t flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setFeedbackModalDisp(null)}
                      className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      disabled={isSubmittingFeedback}
                      className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md flex items-center gap-1.5"
                    >
                      <Icon name="check" className="w-4 h-4" />
                      <span>{isSubmittingFeedback ? 'Menyimpan...' : 'Tandai Selesai & Simpan'}</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isLogoutConfirmOpen && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs">
              <div className="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-2xl shadow-2xl w-full max-w-sm p-6 border border-slate-200 dark:border-slate-700 animate-in fade-in zoom-in-95">
                <div className="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center mx-auto mb-3">
                  <Icon name="logout" className="w-6 h-6" />
                </div>
                <div className="text-center space-y-1">
                  <h3 className="font-bold text-base">Keluar dari Aplikasi?</h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400">Sesi Anda akan diakhiri dan perlu login kembali untuk mengakses data persuratan.</p>
                </div>
                <div className="flex gap-2 mt-5">
                  <button onClick={() => setIsLogoutConfirmOpen(false)} className="flex-1 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Tetap di Aplikasi</button>
                  <button onClick={confirmLogout} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Ya, Keluar</button>
                </div>
              </div>
            </div>
          )}


          {appConfirm && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs">
              <div className="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700 animate-in fade-in zoom-in-95">
                <div className="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 flex items-center justify-center mx-auto mb-3"><Icon name="trash" className="w-6 h-6" /></div>
                <div className="text-center space-y-1"><h3 className="font-bold text-base">{appConfirm.title}</h3><p className="text-xs text-slate-500 dark:text-slate-400">{appConfirm.message}</p></div>
                <div className="flex gap-2 mt-5"><button onClick={() => setAppConfirm(null)} className="flex-1 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold">Batal</button><button onClick={() => { const fn = appConfirm.onConfirm; setAppConfirm(null); fn(); }} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Ya, Hapus</button></div>
              </div>
            </div>
          )}
          {/* TOAST NOTIFIKASI */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 p-4 rounded-2xl bg-slate-900 text-white shadow-2xl border border-slate-700 flex items-center gap-3 animate-in slide-in-from-bottom-5">
              <div className="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                <Icon name="check" className="w-4 h-4" />
              </div>
              <div className="text-xs">
                <p className="font-bold">{toast.title}</p>
                <p className="text-slate-300">{toast.message}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    // React Error Boundary Component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-900 text-white font-sans">
              <div className="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-2xl border border-rose-500/50">
                <div className="w-12 h-12 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center mb-4">
                  <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                  </svg>
                </div>
                <h2 className="text-base font-bold text-white mb-1">Terjadi Kendala Tampilan</h2>
                <p className="text-xs text-slate-300 mb-4">
                  {this.state.error?.message || 'Aplikasi mendeteksi error pada komponen antarmuka. Silakan muat ulang halaman.'}
                </p>
                <button
                  onClick={() => window.location.reload()}
                  className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-colors shadow-md"
                >
                  Muat Ulang Halaman
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Render React App with Root dataset marker
    try {
      const rootContainer = document.getElementById('root');
      if (rootContainer) {
        rootContainer.dataset.mounted = 'true';
        const root = ReactDOM.createRoot(rootContainer);
        root.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      }
    } catch (mountErr) {
      console.error('Mounting error:', mountErr);
    }
  </script>
</body>
</html>
